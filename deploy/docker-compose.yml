# pisha-server behind Caddy (HTTPS) on your own domain.
#
#   cp .env.example .env      # set PISHA_DOMAIN
#   docker compose up -d
#   docker compose logs pisha-server   # the first time: the server token and the /pisha:configure command
#   (later: docker compose exec pisha-server cat /data/server-token /data/join-token)
#
# Only Caddy publishes ports; pisha-server is reachable only through it.

services:
  pisha-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      PUBLIC_URL: https://${PISHA_DOMAIN:?set PISHA_DOMAIN in .env}
      # Caddy sets X-Forwarded-For: rate limits then see each client's address.
      TRUST_PROXY: "1"
    volumes:
      - pisha-data:/data

  caddy:
    # (Fixed by digest, here and in the Dockerfiles: to update, change both the tag and the digest.)
    image: caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b
    restart: unless-stopped
    depends_on:
      - pisha-server
    environment:
      PISHA_DOMAIN: ${PISHA_DOMAIN:?set PISHA_DOMAIN in .env}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  pisha-data:
  caddy-data:
  caddy-config:
